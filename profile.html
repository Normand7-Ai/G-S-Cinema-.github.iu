<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&S Cinema - Profile</title>
    <link id="theme-style" rel="stylesheet" href="assets/css/gold-theme.css">
</head>
<body class="home-page">
    
    <header>
        <div class="logo-container">
            <div class="logo">G & S <span class="logo-sub">CINEMA</span></div>
        </div>
        
        <nav>
            <a href="home.html">Home</a>
            <a href="search.html">Search</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="contact.html">Contact</a>
        </nav>

        <button id="btn-switch" onclick="toggleTheme()">Switch Theme</button>
    </header>

    <main>
        <div class="profile-container">
            <h2>User Profile</h2>
            
            <div class="profile-card">
                <table class="profile-table">
                    <tr>
                        <td><label for="pName">Full Name:</label></td>
                        <td><input type="text" id="pName" placeholder="Enter your name"></td>
                    </tr>
                    <tr>
                        <td><label for="pEmail">Email Address:</label></td>
                        <td><input type="email" id="pEmail" placeholder="Enter your email"></td>
                    </tr>
					<tr>
                        <td><label for="pPass">Password:</label></td>
                        <td><input type="password" id="pPass" placeholder="Enter your Password"></td>
                    </tr>
                </table>
                <button class="btn-main" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 G&S Cinema - All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('pName').value = localStorage.getItem('uName') || 'Guest';
        document.getElementById('pEmail').value = localStorage.getItem('uEmail') || '';
		document.getElementById('pPass').value = localStorage.getItem('uPass') || '';

        function saveProfile() {
            localStorage.setItem('uName', document.getElementById('pName').value);
            localStorage.setItem('uEmail', document.getElementById('pEmail').value);
			localStorage.setItem('uPass', document.getElementById('pPass').value);
            alert("Profile Updated Successfully!");
        }
    </script>
    <script src="assets/js/theme-switcher.js"></script>
</body>
</html>
