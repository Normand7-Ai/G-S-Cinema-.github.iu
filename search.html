<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&S Cinema - Search</title>
    <link id="theme-style" rel="stylesheet" href="assets/css/gold-theme.css">
</head>
<body class="home-page">
    
    <header>
        <div class="logo-container">
            <div class="logo">G & S <span class="logo-sub">CINEMA</span></div>
        </div>
        
        <nav>
            <a href="home.html">Home</a>
            <a href="search.html" class="active">Search</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="profile.html">Profile</a>
            <a href="contact.html">Contact</a>
        </nav>

        <button id="btn-switch" onclick="toggleTheme()">Switch Theme</button>
    </header>

    <main>
        <div class="search-container">
            <h2>Find Your Movie</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Type movie name..." onkeyup="searchMovie()">
                <i class="search-icon">🔍</i>
            </div>
            
            <div id="viewControls" style="margin-bottom: 20px; display: none;">
        <button class="btn-main" style="width:auto; padding:8px 15px;" onclick="changeView('list')">List View ≡</button>
        <button class="btn-main" style="width:auto; padding:8px 15px;" onclick="changeView('grid')">Grid View ⊞</button>
        <button class="btn-main" style="width:auto; padding:8px 15px;" onclick="changeView('details')">Details View ℹ</button>
            </div>

            <div id="resultsArea">
                <p class="error-text">No results found yet.</p>
            </div>

            <div id="paginationArea" class="pagination-controls" style="margin-top: 20px; display: flex; justify-content: center; gap: 10px;">
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 G&S Cinema </p>
    </footer>

    <script src="assets/js/theme-switcher.js"></script>
    <script src="assets/js/logic.js"></script>
</body>
</html>
