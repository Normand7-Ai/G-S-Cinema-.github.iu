<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&S Cinema - Search</title>
    <link id="theme-style" rel="stylesheet" href="assets/css/gold-theme.css">
</head>
<body class="home-page">
    
    <header>
        <div class="logo-container">
            <div class="logo">G & S <span class="logo-sub">CINEMA</span></div>
        </div>
        
        <nav>
            <a href="home.html">Home</a>
            <a href="search.html" class="active">Search</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="profile.html">Profile</a>
            <a href="contact.html">Contact</a>
        </nav>

        <button id="btn-switch" onclick="toggleTheme()">Switch Theme</button>
    </header>

    <main>
    <div class="search-container">
        <h2>Find Your Movie</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Type movie name..." onkeyup="searchMovie()">
            <i class="search-icon">🔍</i>
        </div>

        <div class="view-controls" style="margin-bottom: 20px; text-align: center;">
            <button onclick="changeLayout('list-view')" style="padding: 5px 10px; cursor: pointer;">List View</button>
            <button onclick="changeLayout('grid-view')" style="padding: 5px 10px; cursor: pointer;">Grid View</button>
        </div>
        
        <div id="resultsArea" class="list-view">
            <p class="error-text">No results found yet.</p>
        </div>
    </div>
    </main>

    <footer>
        <p>&copy; 2026 G&S Cinema </p>
    </footer>

    <script src="assets/js/theme-switcher.js"></script>
    <script src="assets/js/logic.js"></script>
</body>
</html>
