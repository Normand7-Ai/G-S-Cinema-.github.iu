<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&S Cinema - Contact Us</title>
    <link id="theme-style" rel="stylesheet" href="assets/css/gold-theme.css">
</head>
<body class="home-page">
    
    <header>
        <div class="logo-container">
            <div class="logo">G & S <span class="logo-sub">CINEMA</span></div>
        </div>
        
        <nav>
            <a href="home.html">Home</a>
            <a href="search.html">Search</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="profile.html">Profile</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

        <button id="btn-switch" onclick="toggleTheme()">Switch Theme</button>
    </header>

    <main>
        <div class="contact-container">
            <h2>Contact Us / Review</h2>
            
            <div class="contact-card">
                <p>We value your feedback. Let us know your thoughts about G&S Cinema!</p>
                <textarea id="feedback" placeholder="Write your review or feedback here..."></textarea>
                <button class="btn-main" onclick="submitFeedback()">Submit Review</button>
            </div>

            <!-- NEW IFRAME SECTION: Google Maps Location -->
            <div class="contact-card" style="margin-top: 20px;">
                <h3 style="color: #d4af37; margin-bottom: 10px;">Our Location</h3>
                <p style="margin-bottom: 15px;">Visit us at our main cinema branch!</p>
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3456.006567151048!2d31.325920315113543!3d29.97729118190675!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x145839213101682f%3A0x89791b5a5b512345!2sCairo%2C%20Egypt!5e0!3m2!1sen!2seg!4v1684340000000!5m2!1sen!2seg" 
                    width="100%" 
                    height="250" 
                    style="border: 1px solid #444; border-radius: 10px;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <div class="danger-zone" style="margin-top: 30px;">
                <hr style="border-color: #333;">
                <p>Account Management</p>
                <button class="btn-logout" onclick="logout()">Logout Now</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 G&S Cinema - All rights reserved.</p>
    </footer>

    <script>
        function submitFeedback() {
            const text = document.getElementById('feedback').value;
            if(text) {
                alert("Thank you for your feedback!");
                document.getElementById('feedback').value = "";
            } else {
                alert("Please write something first.");
            }
        }
    </script>
    <script src="assets/js/theme-switcher.js"></script>
    <script src="assets/js/logic.js"></script>
</body>
</html>
